<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Dawyd Gomes — Desenvolvedor Full Stack">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#30363d"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="fadeMask"><rect x="560" y="0" width="640" height="320" fill="url(#fade)"/></mask>
    <clipPath id="card"><rect x="1" y="1" width="1198" height="318" rx="20"/></clipPath>
    <style>
      .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      .float { animation: float 6s ease-in-out infinite; }
      .fade-in { opacity: 0; animation: fadein .9s ease-out forwards; }
      .d1 { animation-delay: .15s; } .d2 { animation-delay: .35s; } .d3 { animation-delay: .55s; }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
      @keyframes fadein { to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .cursor, .float { animation: none; }
        .fade-in { opacity: 1; animation: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="#161b22"/>
    <rect width="1200" height="320" fill="url(#dots)" mask="url(#fadeMask)"/>
    <circle cx="960" cy="160" r="230" fill="url(#glow)"/>
    <rect x="0" y="0" width="1200" height="5" fill="url(#accent)"/>
  </g>
  <rect x="1" y="1" width="1198" height="318" rx="20" fill="none" stroke="#30363d" stroke-width="2"/>

  <text x="72" y="92" class="mono fade-in" font-size="20" fill="#8b949e">~/dawydgomes <tspan fill="#2dd4bf">$</tspan> whoami<tspan class="cursor" fill="#2dd4bf"> ▍</tspan></text>
  <text x="68" y="168" class="sans fade-in d1" font-size="70" font-weight="700" fill="#e6edf3">Dawyd Gomes</text>
  <text x="72" y="216" class="sans fade-in d2" font-size="30" font-weight="600" fill="url(#accent)">Desenvolvedor Full Stack</text>
  <text x="72" y="262" class="mono fade-in d3" font-size="18" fill="#8b949e">Java · Spring Boot · TypeScript · React · Next.js</text>

  <g class="float" transform-origin="960 160">
    <text x="960" y="198" text-anchor="middle" class="mono" font-size="118" font-weight="700" fill="url(#accent)">&lt;/&gt;</text>
  </g>
</svg>
